services:
  weblens-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weblens-mcp-server
    environment:
      - PORT=8080
      - WEBLENS_HTTP_HOST=0.0.0.0
      - WEBLENS_HTTP_PORT=8080
      - WEBLENS_MCP_PROFILE=full
      # Auth is mandatory: compose fails fast instead of publishing an open MCP endpoint.
      - WEBLENS_HTTP_TOKEN=${WEBLENS_HTTP_TOKEN:?WEBLENS_HTTP_TOKEN must be set (generate one with: openssl rand -hex 32)}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

