[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-web-intelligence-engine"
version = "1.0.0"
description = "High-performance, token-efficient, local-first web intelligence engine for AI agents via MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Autonomous Engineering Team" }
]
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3.0",
    "mcp-types>=2.3.0",
    "httpx>=0.28.1",
    "httpcore>=1.0.9,<2",
    "h2>=4,<5",
    "trafilatura>=2.3.1",
    "ddgs>=9.16.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "cssselect>=1.6,<2",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.6,<3",
    "tiktoken>=0.14.0",
    "pymupdf>=1.28.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "google-genai>=2.34.0",
    "tavily-python>=0.8.5",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.10",
    "playwright>=1.49.0",
    "aiosqlite>=0.22.1",
    "rich>=15.0.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "bandit>=1.9.4",
    "psutil>=7.2.0",
]
redis = [
    "redis>=5,<9"
]
hybrid = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "tokenizers>=0.20,<1"
]

[project.scripts]
web-intel-mcp = "server.mcp_server:main"
# The benchmark harness is run from a checkout: python benchmarks/run_benchmarks.py
# (benchmarks/ is not packaged, so a console-script entry point would be broken.)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--timeout=60"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.14",
    "inline-snapshot>=0.36.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.mypy]
python_version = "3.11"
files = ["weblens/src/weblens"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false

[project.urls]
Repository = "https://github.com/Tusharkapoor-oop/Third-Eye-LLM"
Issues = "https://github.com/Tusharkapoor-oop/Third-Eye-LLM/issues"
Security = "https://github.com/Tusharkapoor-oop/Third-Eye-LLM/security/policy"
